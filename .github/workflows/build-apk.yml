name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          if [ -f "Hamed_AlAlim_Family_Android_Project.zip" ]; then
            unzip -o Hamed_AlAlim_Family_Android_Project.zip
            if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
              SUBFOLDER=$(find . -maxdepth 2 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1 | cut -d'/' -f2)
              if [ -n "$SUBFOLDER" ] && [ -d "$SUBFOLDER" ]; then
                cp -rn "$SUBFOLDER"/* . 2>/dev/null || true
                cp -rn "$SUBFOLDER"/.* . 2>/dev/null || true
              fi
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace
          fi
