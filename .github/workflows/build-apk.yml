name: Build Hamed Al-Alim Family Tree APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded Android project archive
        run: |
          if [ -f Hamed_AlAlim_Family_Android_Project.zip ]; then
            unzip -o Hamed_AlAlim_Family_Android_Project.zip -d .
          fi
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Add legacy launcher icons for Android versions below 26
        run: |
          for icon in ic_launcher.xml ic_launcher_round.xml; do
            cat > "app/src/main/res/mipmap/$icon" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path android:fillColor="#173D35" android:pathData="M0,0h48v48h-48z" />
              <path android:fillColor="#F4D9A2" android:pathData="M24,5 L11,22 H18 L9,33 H19 V43 H29 V33 H39 L30,22 H37 Z" />
          </vector>
          EOF
          done

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build installable APKs
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace
          mkdir -p output-apk
          cp app/build/outputs/apk/debug/app-debug.apk output-apk/Hamed-AlAlim-Family-Tree-debug.apk
          cp app/build/outputs/apk/release/app-release.apk output-apk/Hamed-AlAlim-Family-Tree.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Hamed-AlAlim-Family-Tree-APK
          path: output-apk/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Hamed Al-Alim Family Tree v1.0.${{ github.run_number }}
          body: APK files built automatically by GitHub Actions.
          files: output-apk/*.apk
