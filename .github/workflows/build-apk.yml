name: بناء تطبيق شجرة عائلة حامد العالم (Build Hamed Al-Alim Family Tree APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: تجميع وبناء ملف APK
    runs-on: ubuntu-latest

    steps:
      - name: سحب ملفات المشروع (Checkout Repository)
        uses: actions/checkout@v4

      - name: إعداد بيئة جافا (Set up JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: قبول تراخيص أندرويد (Accept Android SDK Licenses)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/devnull || true

      - name: إعداد Gradle 8.7 (Set up Gradle)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: استعادة مفتاح التوقيع من الأسرار (Restore Keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ ! -f "app/release-key.jks" ] && [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release-key.jks
            echo "Keystore restored from GitHub Secrets."
          fi

      - name: بناء ملف APK (Assemble APK)
        run: |
          if [ -f "app/release-key.jks" ]; then
            echo "Signing key found. Building signed release APK..."
            gradle assembleRelease --no-daemon --stacktrace
            mkdir -p output-apk
            cp app/build/outputs/apk/release/app-release.apk output-apk/Hamed-AlAlim-Family-Tree.apk
          else
            echo "Signing key not found. Falling back to debug APK..."
            gradle assembleDebug --no-daemon --stacktrace
            mkdir -p output-apk
            cp app/build/outputs/apk/debug/app-debug.apk output-apk/Hamed-AlAlim-Family-Tree.apk
          fi

      - name: رفع ملف APK الجاهز (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Hamed-AlAlim-Family-Tree-APK
          path: output-apk/Hamed-AlAlim-Family-Tree.apk
          if-no-files-found: error

      - name: نشر الإصدار في قسم Releases (Create GitHub Release)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: "تطبيق شجرة عائلة حامد العالم — v1.1.${{ github.run_number }}"
          body: |
            ## 🌿 تطبيق شجرة عائلة حامد العالم للأندرويد
            - قم بتحميل ملف **`Hamed-AlAlim-Family-Tree.apk`** أدناه وتثبيته مباشرة على الهاتف.
            - إذا ظهر تنبيه Play Protect، اختر **More details (مزيد من التفاصيل)** ثم **Install anyway (التثبيت على أي حال)**.
          files: |
            output-apk/Hamed-AlAlim-Family-Tree.apk
