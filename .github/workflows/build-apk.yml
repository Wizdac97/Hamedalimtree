{"name": "Build Hamed Al-Alim Family Tree APK", "on": {"push": {"branches": ["main", "master"]}, "workflow_dispatch": null}, "permissions": {"contents": "write"}, "jobs": {"build-apk": {"name": "Build APK", "runs-on": "ubuntu-latest", "steps": [{"name": "Checkout Repository", "uses": "actions/checkout@v4"}, {"name": "Extract and Prepare Project", "run": "if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then for z in *.zip; do [ -f \"$z\" ] && unzip -q -o \"$z\"; done; SUBDIR=$(find . -maxdepth 2 -name \"settings.gradle*\" -printf \"%h\\n\" | head -n 1); if [ -n \"$SUBDIR\" ] && [ \"$SUBDIR\" != \".\" ]; then cp -r \"$SUBDIR\"/. .; fi; fi && sed -i \"s/minSdk = 24/minSdk = 26/g\" app/build.gradle.kts 2>/dev/null || true && rm -f app/src/main/res/mipmap/ic_launcher.xml app/src/main/res/mipmap/ic_launcher_round.xml"}, {"name": "Set up JDK 17", "uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}}, {"name": "Accept Licenses and Restore Keystore", "run": "yes | \"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\" --licenses >/dev/null 2>&1 || true; if [ ! -f app/release-key.jks ]; then keytool -genkeypair -v -keystore app/release-key.jks -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 10000 -alias hamed_alalim_key -storepass AlAlimFamily2026 -keypass AlAlimFamily2026 -dname \"CN=Hamed AlAlim, O=AlAlimSudan, C=SD\"; fi"}, {"name": "Set up Gradle 8.7", "uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.7"}}, {"name": "Assemble APK", "run": "mkdir -p output-apk && gradle assembleRelease assembleDebug --no-daemon --stacktrace && if [ -f app/build/outputs/apk/release/app-release.apk ]; then cp app/build/outputs/apk/release/app-release.apk output-apk/Hamed-AlAlim-Family-Tree.apk; else cp app/build/outputs/apk/debug/app-debug.apk output-apk/Hamed-AlAlim-Family-Tree.apk; fi"}, {"name": "Upload APK Artifact", "uses": "actions/upload-artifact@v4", "with": {"name": "Hamed-AlAlim-Family-Tree-APK", "path": 